# Static Astro site — do not auto-add @astrojs/cloudflare (keeps output in dist/).
name = "halloweenthegame-cheats-net"
compatibility_date = "2025-10-11"

# Bind custom domains so DNS records exist for GSC / crawlers.
[[routes]]
pattern = "halloweenthegamecheats.net"
custom_domain = true

[[routes]]
pattern = "www.halloweenthegamecheats.net"
custom_domain = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
# Required so / and /about/ resolve to index.html (none breaks every HTML page).
html_handling = "auto-trailing-slash"
